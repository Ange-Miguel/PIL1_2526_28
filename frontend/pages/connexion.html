<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - IFRI_MentorLink</title>
    <link rel="stylesheet" href="../styles/base/variables.css">
    <link rel="stylesheet" href="../styles/base/reset.css">
    <link rel="stylesheet" href="../styles/components/navbar.css">
    <link rel="stylesheet" href="../styles/components/footer.css">
    <link rel="stylesheet" href="../styles/components/buttons.css">
    <link rel="stylesheet" href="../styles/components/forms.css">
    <link rel="stylesheet" href="../styles/pages/auth.css">


</head>

<body>
    <div id="navbar"></div>

    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo"><img src="../assets/images/logo.jpg" alt="Logo"></div>
                <h1>IFRI_<span>MentorLink</span></h1>
                <p>Plateforme de mentorat académique</p>
            </div>
            <div class="auth-body">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin">Connexion</button>
                    <button class="auth-tab" id="tabReg"
                        onclick="window.location.href='inscription.html'">Inscription</button>
                </div>

                <div id="alertBox" class="alert alert-danger mb-16"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email ou téléphone <span>*</span></label>
                        <div class="input-icon-wrap">
                            <span class="input-icon">📧</span>
                            <input type="text" class="form-control" id="identifier"
                                placeholder="email@ifri.bj ou 6XXXXXXXX" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mot de passe <span>*</span></label>
                        <div class="input-icon-wrap">
                            <span class="input-icon">🔒</span>
                            <input type="password" class="form-control" id="password" placeholder="Votre mot de passe"
                                required>
                            <button type="button" class="password-toggle" id="togglePwd">👁</button>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mb-16">
                        <label class="remember-label">
                            <input type="checkbox" id="remember"> Se souvenir de moi
                        </label>
                        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                        Se connecter
                    </button>
                </form>

                <div class="divider">
                    <hr><span>COMPTE DÉMO</span>
                    <hr>
                </div>
                <div class="demo-buttons">
                    <button class="btn btn-secondary btn-sm" onclick="demoLogin('ange@ifri.bj')">🎓 Connexion démo
                        (Ange)</button>
                    <button class="btn btn-secondary btn-sm" onclick="demoLogin('merveilles@ifri.bj')">🎓 Connexion démo
                        (Merveilles)</button>
                </div>

                <div class="auth-footer-link">
                    Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('connexion.html');
            requireGuest();
        });

        document.getElementById('togglePwd').addEventListener('click', function () {
            const inp = document.getElementById('password');
            inp.type = inp.type === 'password' ? 'text' : 'password';
            this.textContent = inp.type === 'password' ? '👁' : '🙈';
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            login(document.getElementById('identifier').value.trim(),
                document.getElementById('password').value);
        });

        function login(identifier, password) {
            const users = ML.load('ml_users', []);
            const user = users.find(u =>
                (u.email === identifier || u.tel === identifier) && u.password === password
            );
            const alert = document.getElementById('alertBox');
            if (!user) {
                alert.style.display = 'flex';
                alert.textContent = '❌ Identifiant ou mot de passe incorrect.';
                return;
            }
            ML.login(user);
            showToast('Bienvenue ' + user.prenom + ' ! 👋');
            setTimeout(() => window.location.href = 'accueil.html', 800);
        }

        function demoLogin(email) {
            login(email, '1234');
        } 
    </script>
</body>

</html>
